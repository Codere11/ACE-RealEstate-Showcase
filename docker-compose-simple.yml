version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ace-postgres
    environment:
      POSTGRES_DB: ace_platform
      POSTGRES_USER: ace_user
      POSTGRES_PASSWORD: ${ACE_DB_PASSWORD:-test_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace_user -d ace_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: ace-livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    network_mode: host
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
