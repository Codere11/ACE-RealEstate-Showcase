<div class="staff-video" [class.fade-in]="live()" [class.connecting]="connecting()">
  @if (connecting()) {
    <div class="video-pending">
      <div class="pulse-ring"></div>
      <span>Povezovanje s kamero...</span>
    </div>
  } @else if (live()) {
    <div class="video-frame">
      <video id="livekit-video" autoplay playsinline></video>
      <div class="live-badge">● V živo</div>
    </div>
  }
</div>
