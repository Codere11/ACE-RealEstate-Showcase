<section class="services-section">
  <h2 class="section-title">Naše storitve</h2>
  <div class="service-grid">
    @for (svc of salon.services; track svc.id) {
      <div class="service-card" (mouseenter)="scrollIntoView($event)">
        <div class="service-details">
          <h3 class="service-name">{{ svc.name }}</h3>
          <div class="service-meta">
            <span class="duration">⏱ {{ svc.durationMin }} min</span>
            <span class="price">{{ svc.priceEur }} €</span>
          </div>
        </div>
        @if (svc.addons && svc.addons.length) {
          <div class="service-addons">
            @for (a of svc.addons; track a.name) {
              <span class="addon-item">+ {{ a.name }} {{ a.priceEur }}€</span>
            }
          </div>
        }
      </div>
    }
  </div>
</section>
