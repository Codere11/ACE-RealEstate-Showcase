<section class="services-section">
  <h2 class="section-title">Naše storitve</h2>
  <div class="service-grid">
    @for (svc of salon.services; track svc.id) {
      <div class="service-card">
        <div class="service-image">
          <div class="image-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.5">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span>AI fotografija</span>
          </div>
        </div>
        <div class="service-details">
          <h3 class="service-name">{{ svc.name }}</h3>
          <div class="service-meta">
            <span class="duration">⏱ {{ svc.durationMin }} min</span>
            <span class="price">{{ svc.priceEur }} €</span>
          </div>
          <button class="book-btn" (click)="onBook(svc.id)">Rezerviraj</button>
        </div>
      </div>
    }
  </div>
</section>
