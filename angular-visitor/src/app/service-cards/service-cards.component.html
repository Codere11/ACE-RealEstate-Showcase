<section class="services-section">
  <div class="service-grid">
    @for (svc of salon.services; track svc.id) {
      <div class="service-card" (click)="onCardClick(svc.id)">
        <div class="service-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            @switch (svc.id) {
              @case ('ai-reception') {
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="9" cy="9" r="2"/>
                <line x1="13" y1="9" x2="18" y2="9"/>
                <line x1="13" y1="13" x2="18" y2="13"/>
                <line x1="13" y1="17" x2="18" y2="17"/>
              }
              @case ('analytics') {
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
              }
              @case ('integrations') {
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              }
              @case ('lead-scoring') {
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              }
            }
          </svg>
        </div>
        <div class="service-info">
          <div class="service-name">{{ svc.name }}</div>
          <div class="service-desc">{{ descFor(svc.id) }}</div>
        </div>
      </div>
    }
  </div>
</section>
