<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE e-Counter</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            color: #22252A;
            background: #0C0D10;
        }
        .agent-hero {
            padding: 10px 18px 4px;
            background:
                radial-gradient(1200px 400px at 18% -80px, rgba(193,164,108,.12), transparent 60%),
                linear-gradient(180deg, #121417 0%, #0C0D10 70%);
            border-bottom: 1px solid rgba(193,164,108,.18);
        }
        .agent-hero__inner {
            width: 100%;
            display: grid;
            gap: 8px;
        }
        .agent-hero__brand {
            color: rgba(250,250,247,.92);
            font-size: .92rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .agent-hero__camera {
            width: min(100%, 520px);
            aspect-ratio: 16 / 9;
            justify-self: center;
            border-radius: 18px;
            background: #020303;
            border: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 24px 60px rgba(0,0,0,.38);
            position: relative;
            overflow: hidden;
        }
        .agent-hero__camera.joining { border-color: rgba(193,164,108,.52); }
        .agent-hero__camera.live {
            border-color: rgba(16,185,129,.55);
            box-shadow: 0 24px 60px rgba(16,185,129,.18);
        }
        .agent-hero__camera.ended { border-color: rgba(239,68,68,.42); }
        .agent-hero__live-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity .2s ease;
            background: #020303;
        }
        .agent-hero__live-video.visible { opacity: 1; }
        .agent-hero__camera-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, rgba(2,3,3,.18), rgba(2,3,3,.5));
            color: #F9FAFB;
        }
        .agent-hero__camera-eyebrow {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: rgba(249,250,251,.72);
        }
        .agent-hero__camera-title {
            font-size: clamp(16px, 2vw, 22px);
            font-weight: 700;
            line-height: 1.25;
            max-width: 28rem;
        }
        .agent-hero__live-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(2,3,3,.72);
            color: #F9FAFB;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
        }
        .agent-hero__audio-toggle {
            position: absolute;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(2,3,3,.78);
            color: #F9FAFB;
            padding: 8px 12px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
        }
        .agent-hero__audio-toggle:hover {
            background: rgba(17,24,39,.9);
        }
        .agent-page { padding: 4px 14px 18px; }
        .survey-card {
            max-width: 980px;
            margin: 8px auto 12px;
            background: #FFFFFF;
            border: 1px solid #E6E2D6;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.12) inset;
            padding: 18px;
        }
        .survey-container {
            max-width: 760px;
            margin: 0 auto;
            display: grid;
            gap: 18px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #E7E1D2;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #C1A46C, #A98C58);
            transition: width .2s ease;
        }
        .progress-text,
        .question-subtitle,
        .meta,
        .muted {
            color: #6B7280;
        }
        .takeover-banner {
            display: none;
            border: 1px solid #E6D4A7;
            background: #FBF5E7;
            color: #5E4A20;
            border-radius: 14px;
            padding: 12px 14px;
            font-weight: 700;
        }
        .question-title {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 14px;
            line-height: 1.35;
            text-align: center;
        }
        .question-subtitle {
            margin: 0;
            text-align: center;
            font-size: 15px;
        }
        .choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .choice-button {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #E6E2D6;
            border-radius: 12px;
            background: #FFFFFF;
            font-size: 16px;
            color: #374151;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
        }
        .choice-button:hover {
            border-color: #C1A46C;
            background: #FBF7EE;
            color: #5E4A20;
        }
        .choice-button:disabled {
            opacity: .65;
            cursor: wait;
        }
        .survey-answer {
            display: grid;
            gap: 10px;
        }
        .survey-input {
            display: none;
            gap: 10px;
        }
        .survey-input textarea {
            width: 100%;
            min-height: 96px;
            border-radius: 14px;
            border: 1px solid #D7D0C0;
            padding: 14px;
            font: inherit;
            resize: vertical;
        }
        .takeover-chat {
            display: none;
            gap: 14px;
        }
        .thread {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px;
            border-radius: 16px;
            background: #F8F7F3;
            border: 1px solid #E6E2D6;
            max-height: 420px;
            min-height: 120px;
            overflow-y: auto;
            align-items: stretch;
        }
        .bubble {
            width: auto;
            max-width: 75%;
            align-self: flex-start;
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid #E6E2D6;
            background: #FFFFFF;
            line-height: 1.45;
            box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 2px 6px rgba(17,19,23,.04);
        }
        .bubble.user {
            align-self: flex-end;
            background: #1A1D22;
            color: #FAFAF7;
            border-color: #2C2F35;
            box-shadow: 0 8px 18px rgba(0,0,0,.25);
        }
        .bubble.assistant, .bubble.staff { align-self: flex-start; }
        .bubble.staff { background: #FBF5E7; border-color: #E6D4A7; color: #1F2937; }
        .bubble.pending { opacity: .72; }
        .bubble__body {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
        }
        .composer {
            display: grid;
            gap: 10px;
        }
        .composer textarea {
            width: 100%;
            min-height: 100px;
            border-radius: 14px;
            border: 1px solid #D7D0C0;
            padding: 14px;
            font: inherit;
            resize: vertical;
        }
        .composer-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-button {
            padding: 12px 18px;
            border-radius: 999px;
            border: 1px solid #D7D0C0;
            background: #FFFFFF;
            color: #374151;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-button.primary {
            border-color: #C1A46C;
            background: #C1A46C;
            color: #1E2126;
        }
        @media (max-width: 640px) {
            .agent-page { padding: 4px 10px 10px; }
            .survey-card { padding: 16px; }
            .question-title { font-size: 21px; }
            .composer-actions { flex-direction: column; align-items: stretch; }
            .nav-button { width: 100%; }
        }
    </style>
</head>
<body>
<section class="agent-hero">
    <div class="agent-hero__inner">
        <div class="agent-hero__brand">ACE e-Counter</div>
        <div id="liveHelpCamera" class="agent-hero__camera">
            <video id="liveHelpVideo" class="agent-hero__live-video" autoplay playsinline></video>
            <audio id="liveHelpAudio" autoplay muted></audio>
            <div id="liveHelpState" class="agent-hero__camera-state" style="display:none;">
                <div class="agent-hero__camera-eyebrow">Live help</div>
                <div id="liveHelpTitle" class="agent-hero__camera-title">Live help has ended</div>
            </div>
            <div id="liveHelpBadge" class="agent-hero__live-badge" style="display:none;">A team member live</div>
            <button id="liveHelpAudioToggle" class="agent-hero__audio-toggle" type="button" style="display:none;">Unmute</button>
        </div>
    </div>
</section>

<div class="agent-page" id="chat-app"
     th:attr="data-org-slug=${organization.slug},data-survey-slug=${surveySlug},data-sid=${sid},data-progress=${lead.surveyProgress},data-status=${lead.status},data-takeover=${lead.takeoverActive}">
    <div class="survey-card">
        <div class="survey-container">
            <div>
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                <div id="progressText" class="progress-text">0% complete</div>
            </div>

            <div id="takeoverBanner" class="takeover-banner">Our team member has now entered the chat, you are speaking to a human.</div>

            <div>
                <h1 id="questionTitle" class="question-title" th:text="${isDefaultSurvey} ? 'What kind of property are you interested in?' : 'Let\'s continue with a few quick questions.'">What kind of property are you interested in?</h1>
                <p id="questionSubtitle" class="question-subtitle">Choose one of the quick starts below.</p>
            </div>

            <div id="surveyFlow" class="survey-answer">
                <div id="choicesGrid" class="choices-grid">
                    <button type="button" class="choice-button" data-choice="Buying a home">Buying a home</button>
                    <button type="button" class="choice-button" data-choice="Selling a property">Selling a property</button>
                    <button type="button" class="choice-button" data-choice="Renting">Renting</button>
                    <button type="button" class="choice-button" data-choice="Just exploring options">Just exploring options</button>
                </div>
                <div id="surveyInputWrap" class="survey-input">
                    <textarea id="surveyInput" placeholder="Type your answer here…"></textarea>
                    <div class="composer-actions">
                        <button id="surveySendButton" type="button" class="nav-button primary">Continue</button>
                    </div>
                </div>
            </div>

            <div id="takeoverChat" class="takeover-chat" style="display:none;">
                <div id="thread" class="thread"></div>

                <div class="composer">
                    <textarea id="takeoverInput" placeholder="Write your message here…"></textarea>
                    <div class="composer-actions">
                        <button id="takeoverSendButton" type="button" class="nav-button primary">Send message</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script th:inline="javascript">
(() => {
  const root = document.getElementById('chat-app');
  if (!root) return;

  const state = {
    orgSlug: root.dataset.orgSlug,
    surveySlug: root.dataset.surveySlug,
    sid: root.dataset.sid,
    progress: Number(root.dataset.progress || 0),
    takeoverActive: root.dataset.takeover === 'true',
    takeoverNoticeVisible: false,
    sending: false,
    currentStep: null,
    completed: false,
    completedTitle: null,
    completedSubtitle: null,
    since: 0,
    messageIds: new Set(),
    pendingMessageIds: new Set(),
    polling: false,
    liveHelpState: 'idle',
    liveHelpManagerName: '',
    liveHelpAudioMuted: true
  };

  const els = {
    progressFill: document.getElementById('progressFill'),
    progressText: document.getElementById('progressText'),
    takeoverBanner: document.getElementById('takeoverBanner'),
    questionTitle: document.getElementById('questionTitle'),
    questionSubtitle: document.getElementById('questionSubtitle'),
    surveyFlow: document.getElementById('surveyFlow'),
    choicesGrid: document.getElementById('choicesGrid'),
    surveyInputWrap: document.getElementById('surveyInputWrap'),
    surveyInput: document.getElementById('surveyInput'),
    surveySendButton: document.getElementById('surveySendButton'),
    thread: document.getElementById('thread'),
    takeoverChat: document.getElementById('takeoverChat'),
    takeoverInput: document.getElementById('takeoverInput'),
    takeoverSendButton: document.getElementById('takeoverSendButton'),
    liveHelpCamera: document.getElementById('liveHelpCamera'),
    liveHelpState: document.getElementById('liveHelpState'),
    liveHelpTitle: document.getElementById('liveHelpTitle'),
    liveHelpBadge: document.getElementById('liveHelpBadge'),
    liveHelpVideo: document.getElementById('liveHelpVideo'),
    liveHelpAudio: document.getElementById('liveHelpAudio'),
    liveHelpAudioToggle: document.getElementById('liveHelpAudioToggle')
  };

  let liveRoom = null;
  let liveRoomName = null;

  function renderLiveHelp() {
    els.liveHelpCamera.classList.remove('joining', 'live', 'ended');
    if (state.liveHelpState !== 'idle') {
      els.liveHelpCamera.classList.add(state.liveHelpState);
    }
    els.liveHelpVideo.classList.toggle('visible', state.liveHelpState === 'live');
    els.liveHelpState.style.display = (state.liveHelpState === 'joining' || state.liveHelpState === 'ended') ? 'flex' : 'none';
    els.liveHelpBadge.style.display = state.liveHelpState === 'live' ? 'block' : 'none';
    els.liveHelpAudioToggle.style.display = state.liveHelpState === 'live' ? 'inline-flex' : 'none';
    els.liveHelpAudioToggle.textContent = state.liveHelpAudioMuted ? 'Unmute' : 'Mute';

    if (state.liveHelpState === 'joining') {
      els.liveHelpTitle.textContent = `${state.liveHelpManagerName || 'A team member'} is joining to help`;
      return;
    }
    if (state.liveHelpState === 'live') {
      els.liveHelpBadge.textContent = `${state.liveHelpManagerName || 'A team member'} live`;
      return;
    }
    if (state.liveHelpState === 'ended') {
      els.liveHelpTitle.textContent = 'Live help has ended';
    }
  }

  function toggleLiveHelpAudio() {
    state.liveHelpAudioMuted = !state.liveHelpAudioMuted;
    els.liveHelpAudio.muted = state.liveHelpAudioMuted;
    els.liveHelpAudioToggle.textContent = state.liveHelpAudioMuted ? 'Unmute' : 'Mute';
    if (!state.liveHelpAudioMuted) {
      els.liveHelpAudio.play().catch(() => {});
    }
  }

  function disconnectLiveHelpRoom() {
    try { liveRoom?.disconnect(); } catch {}
    liveRoom = null;
    liveRoomName = null;
    els.liveHelpVideo.srcObject = null;
    els.liveHelpAudio.srcObject = null;
    try { els.liveHelpVideo.load(); } catch {}
    try { els.liveHelpAudio.load(); } catch {}
  }

  async function connectToLiveHelp(live) {
    const client = window.LivekitClient;
    if (!client || !live?.ws_url || !live?.token || !live?.room_name) return;
    if (liveRoom && liveRoomName === live.room_name) {
      state.liveHelpState = 'live';
      renderLiveHelp();
      return;
    }

    disconnectLiveHelpRoom();
    state.liveHelpState = 'joining';
    renderLiveHelp();

    try {
      const room = new client.Room();
      room.on(client.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === client.Track.Kind.Video) {
          track.attach(els.liveHelpVideo);
          els.liveHelpVideo.autoplay = true;
          els.liveHelpVideo.playsInline = true;
          els.liveHelpVideo.play().catch(() => {});
          state.liveHelpState = 'live';
          renderLiveHelp();
        }
        if (track.kind === client.Track.Kind.Audio) {
          els.liveHelpAudio.autoplay = true;
          els.liveHelpAudio.muted = state.liveHelpAudioMuted;
          track.attach(els.liveHelpAudio);
        }
      });
      room.on(client.RoomEvent.Disconnected, () => {
        disconnectLiveHelpRoom();
        state.liveHelpState = 'ended';
        renderLiveHelp();
      });
      await room.connect(live.ws_url, live.token);
      liveRoom = room;
      liveRoomName = live.room_name;
    } catch (error) {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'ended';
      renderLiveHelp();
    }
  }

  async function loadLiveHelpState() {
    const res = await fetch(`/api/public/organizations/${encodeURIComponent(state.orgSlug)}/live-session?sid=${encodeURIComponent(state.sid)}`, { credentials: 'same-origin' });
    if (!res.ok) return;
    const live = await res.json();
    state.liveHelpManagerName = live.manager_display_name || live.managerDisplayName || '';
    if (live.status === 'live') {
      await connectToLiveHelp(live);
      state.liveHelpState = 'live';
    } else if (live.status === 'preview') {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'joining';
    } else if (live.status === 'ended') {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'ended';
    } else {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'idle';
    }
    renderLiveHelp();
  }

  function renderBanner() {
    els.takeoverBanner.style.display = state.takeoverNoticeVisible ? 'block' : 'none';
    els.surveyFlow.style.display = state.takeoverActive ? 'none' : 'grid';
    els.takeoverChat.style.display = state.takeoverActive ? 'grid' : 'none';
    if (state.takeoverActive) {
      els.questionTitle.style.display = 'none';
      els.questionSubtitle.style.display = 'none';
      return;
    }
    els.questionTitle.style.display = 'block';
    els.questionSubtitle.style.display = 'block';
  }

  function renderProgress() {
    const pct = Math.max(0, Math.min(100, state.progress || 0));
    els.progressFill.style.width = pct + '%';
    els.progressText.textContent = pct + '% complete';
  }

  function appendMessage(role, text, timestamp, options = {}) {
    const id = role + '|' + text + '|' + timestamp;
    const pending = !!options.pending;
    if (!pending && role === 'user') {
      const pendingBubble = Array.from(els.thread.querySelectorAll('.bubble.pending[data-role="user"]')).find(node => (node.dataset.text || '') === String(text || ''));
      if (pendingBubble) {
        pendingBubble.classList.remove('pending');
        pendingBubble.dataset.pending = 'false';
        pendingBubble.dataset.messageId = id;
        state.pendingMessageIds.delete(pendingBubble.dataset.tempId || '');
        state.messageIds.add(id);
        return;
      }
    }
    if (!pending && state.messageIds.has(id)) return;
    if (!pending) state.messageIds.add(id);
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role + (pending ? ' pending' : '');
    bubble.dataset.role = role;
    bubble.dataset.text = text || '';
    bubble.dataset.pending = pending ? 'true' : 'false';
    if (options.tempId) bubble.dataset.tempId = options.tempId;
    if (!pending) bubble.dataset.messageId = id;
    bubble.innerHTML = `<div class="bubble__body"></div>`;
    bubble.querySelector('.bubble__body').textContent = text || '';
    els.thread.appendChild(bubble);
    els.thread.scrollTop = els.thread.scrollHeight;
  }

  function appendPendingUserMessage(text) {
    const tempId = 'pending-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    state.pendingMessageIds.add(tempId);
    appendMessage('user', text, tempId, { pending: true, tempId });
    return tempId;
  }

  function removePendingMessage(tempId) {
    if (!tempId) return;
    state.pendingMessageIds.delete(tempId);
    els.thread.querySelector(`[data-temp-id="${tempId}"]`)?.remove();
  }

  async function loadThread() {
    const res = await fetch(`/api/public/organizations/${encodeURIComponent(state.orgSlug)}/leads/${encodeURIComponent(state.sid)}/messages`, { credentials: 'same-origin' });
    if (!res.ok) return;
    const items = await res.json();
    els.thread.innerHTML = '';
    state.messageIds.clear();
    state.pendingMessageIds.clear();
    items.forEach(m => appendMessage(m.role, m.text, m.timestamp));
    if (items.some(m => m.role === 'staff')) {
      state.takeoverActive = true;
      state.takeoverNoticeVisible = true;
      renderBanner();
    }
  }

  function setChoicesDisabled(disabled) {
    els.choicesGrid.querySelectorAll('[data-choice]').forEach(button => {
      button.disabled = disabled;
    });
    els.surveySendButton.disabled = disabled;
  }

  function renderSurveyStep() {
    if (state.takeoverActive) return;

    if (state.completed || !state.currentStep) {
      els.questionTitle.textContent = state.completedTitle || 'Thanks — your information has been received.';
      els.questionSubtitle.textContent = state.completedSubtitle || 'A team member can continue from here when needed.';
      els.choicesGrid.style.display = 'none';
      els.surveyInputWrap.style.display = 'none';
      return;
    }

    els.questionTitle.textContent = state.currentStep.title || 'Let\'s continue.';
    els.questionSubtitle.textContent = state.currentStep.description || `Question ${state.currentStep.orderIndex}`;

    if (state.currentStep.questionType === 'SINGLE_CHOICE') {
      els.choicesGrid.innerHTML = '';
      (state.currentStep.options || []).forEach(option => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice-button';
        button.dataset.choice = option;
        button.textContent = option;
        button.disabled = state.sending;
        els.choicesGrid.appendChild(button);
      });
      els.choicesGrid.style.display = 'grid';
      els.surveyInputWrap.style.display = 'none';
      return;
    }

    els.choicesGrid.style.display = 'none';
    els.surveyInputWrap.style.display = 'grid';
    els.surveyInput.placeholder = state.currentStep.placeholder || 'Type your answer here…';
  }

  function applySurveyState(data) {
    if (!data) return;
    state.progress = Number(data.surveyProgress || state.progress || 0);
    state.currentStep = data.currentStep || null;
    state.completed = !!data.storyComplete;
    state.completedTitle = data.completionTitle || null;
    state.completedSubtitle = data.completionSubtitle || null;
    renderProgress();
    renderSurveyStep();
  }

  async function loadSurveyState() {
    const res = await fetch(`/api/public/organizations/${encodeURIComponent(state.orgSlug)}/surveys/${encodeURIComponent(state.surveySlug)}?sid=${encodeURIComponent(state.sid)}`, { credentials: 'same-origin' });
    if (!res.ok) return;
    const data = await res.json();
    if (data.sid && data.sid !== state.sid) {
      state.sid = data.sid;
      root.dataset.sid = data.sid;
      history.replaceState({}, '', `/${state.orgSlug}/survey/${state.surveySlug}?sid=${encodeURIComponent(data.sid)}`);
    }
    applySurveyState(data);
  }

  async function sendMessage(text) {
    const trimmed = (text || '').trim();
    if (!trimmed || state.sending) return;
    state.sending = true;
    const inTakeover = state.takeoverActive;
    let pendingId = null;
    if (inTakeover) {
      els.takeoverInput.value = '';
      pendingId = appendPendingUserMessage(trimmed);
    } else {
      setChoicesDisabled(true);
      if (state.currentStep?.questionType === 'SHORT_TEXT') {
        els.surveyInput.value = '';
      }
    }
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sid: state.sid,
          message: trimmed,
          tenant_slug: state.orgSlug,
          meta: { organization_slug: state.orgSlug, survey_slug: state.surveySlug }
        })
      });
      if (!res.ok) {
        removePendingMessage(pendingId);
        return;
      }
      const data = await res.json();
      if (data.sid && data.sid !== state.sid) {
        state.sid = data.sid;
        root.dataset.sid = data.sid;
        history.replaceState({}, '', `/${state.orgSlug}/survey/${state.surveySlug}?sid=${encodeURIComponent(data.sid)}`);
      }
      await loadLiveHelpState();
      if (inTakeover) {
        await loadThread();
      } else {
        applySurveyState(data);
      }
    } catch (error) {
      removePendingMessage(pendingId);
      throw error;
    } finally {
      state.sending = false;
      if (!inTakeover) setChoicesDisabled(false);
    }
  }

  async function poll() {
    if (state.polling) return;
    state.polling = true;
    try {
      const res = await fetch(`/chat-events/poll?sid=${encodeURIComponent(state.sid)}&tenantSlug=${encodeURIComponent(state.orgSlug)}&since=${state.since}&timeout=20`, { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      (data.events || []).forEach(evt => {
        state.since = Math.max(state.since, evt._seq || 0);
        if (evt.type === 'message.created') {
          const role = evt.payload?.role || 'assistant';
          appendMessage(role, evt.payload?.text || '', evt.payload?.timestamp || evt.ts);
          if (role === 'staff') {
            state.takeoverActive = true;
            state.takeoverNoticeVisible = true;
            renderBanner();
            loadThread();
          }
        }
        if (evt.type === 'survey.paused' || evt.type === 'takeover.started') {
          loadThread();
          loadLiveHelpState();
        }
        if (evt.type === 'takeover.ended') {
          state.takeoverActive = false;
          state.takeoverNoticeVisible = false;
          renderBanner();
        }
        if (evt.type === 'live_session.live') {
          state.liveHelpManagerName = evt.payload?.managerDisplayName || evt.payload?.manager_display_name || state.liveHelpManagerName;
          loadLiveHelpState();
        }
        if (evt.type === 'live_session.ended') {
          disconnectLiveHelpRoom();
          state.liveHelpState = 'ended';
          renderLiveHelp();
          setTimeout(() => {
            if (state.liveHelpState === 'ended') {
              state.liveHelpState = 'idle';
              renderLiveHelp();
            }
          }, 3200);
        }
        if (evt.type === 'lead.touched' && evt.payload?.survey_progress != null) {
          state.progress = Number(evt.payload.survey_progress || 0);
          renderProgress();
        }
      });
      state.since = Math.max(state.since, data.next || state.since);
    } finally {
      state.polling = false;
      setTimeout(poll, 250);
    }
  }

  els.liveHelpAudioToggle.addEventListener('click', toggleLiveHelpAudio);
  els.surveySendButton.addEventListener('click', () => sendMessage(els.surveyInput.value));
  els.surveyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(els.surveyInput.value);
    }
  });

  els.takeoverSendButton.addEventListener('click', () => sendMessage(els.takeoverInput.value));
  els.takeoverInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(els.takeoverInput.value);
    }
  });
  els.choicesGrid.addEventListener('click', (e) => {
    const button = e.target.closest('[data-choice]');
    if (!button) return;
    sendMessage(button.dataset.choice || '');
  });

  renderProgress();
  renderBanner();
  renderLiveHelp();
  loadLiveHelpState().finally(() => loadSurveyState().finally(() => loadThread().finally(poll)));
})();
</script>
</body>
</html>
