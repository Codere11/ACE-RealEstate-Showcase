<!DOCTYPE html>
<html lang="sl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${organization.name} + ' · ProstorAI e-Counter'">ProstorAI e-Counter</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            color: #F9FAFB; background: #0C0D10; overflow: hidden;
        }

        /* ── Camera hero ── */
        .app { position: relative; height: 100vh; }
        .agent-hero {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            padding: 10px 16px 6px;
            background: radial-gradient(1200px 400px at 18% -80px, rgba(193,164,108,.08), transparent 60%);
            pointer-events: none;
        }
        .agent-hero > * { pointer-events: auto; }
        .agent-hero__inner { display: grid; gap: 8px; }
        .agent-hero__brand {
            display: inline-block;
            width: fit-content;
            padding: 6px 14px;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(6px);
            border-radius: 10px;
            color: rgba(250,250,247,.92); font-size: .9rem; font-weight: 700;
            letter-spacing: .08em; text-transform: uppercase;
        }
        .agent-hero__camera {
            display: none;
            margin-top: 70px;
            width: min(100%, 480px); aspect-ratio: 16 / 9; justify-self: center;
            border-radius: 16px; background: #020303; border: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 20px 50px rgba(0,0,0,.38); position: relative; overflow: hidden;
        }
        .agent-hero__camera.joining { border-color: rgba(193,164,108,.52); }
        .agent-hero__camera.live {
            border-color: rgba(16,185,129,.55);
            box-shadow: 0 20px 50px rgba(16,185,129,.18);
        }
        .agent-hero__camera.ended { border-color: rgba(239,68,68,.42); }
        .agent-hero__live-video {
            width: 100%; height: 100%; object-fit: cover; display: block;
            opacity: 0; transition: opacity .2s ease; background: #020303;
        }
        .agent-hero__live-video.visible { opacity: 1; }
        .agent-hero__camera-state {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px;
            text-align: center; padding: 16px; color: #F9FAFB;
            background: linear-gradient(180deg, rgba(2,3,3,.18), rgba(2,3,3,.5));
        }
        .agent-hero__camera-eyebrow {
            font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
            color: rgba(249,250,251,.72);
        }
        .agent-hero__camera-title {
            font-size: clamp(14px, 1.8vw, 20px); font-weight: 700;
            line-height: 1.25; max-width: 26rem;
        }
        .agent-hero__live-badge {
            position: absolute; top: 10px; left: 10px;
            padding: 5px 9px; border-radius: 999px;
            background: rgba(2,3,3,.72); color: #F9FAFB;
            font-size: 11px; font-weight: 800; letter-spacing: .04em;
        }
        .agent-hero__audio-toggle {
            position: absolute; right: 10px; bottom: 10px;
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(2,3,3,.78); color: #F9FAFB;
            padding: 7px 11px; border-radius: 999px;
            font-weight: 700; font-size: 12px; cursor: pointer;
        }
        .agent-hero__audio-toggle:hover { background: rgba(17,24,39,.9); }

        /* ── Map ── */
        .map-stage {
            position: absolute; inset: 0; z-index: 1;
        }
        #map { position: absolute; inset: 0; background: #1a1a2e; }

        /* ── Floating Search ── */
        .map-search {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            z-index: 20; width: min(460px, 92vw);
        }
        .map-search__input-wrap {
            position: relative;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(12,13,16,.9);
            backdrop-filter: blur(14px) saturate(1.2);
            box-shadow: 0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
            transition: box-shadow .2s ease, border-color .2s ease;
        }
        .map-search__input-wrap:focus-within {
            border-color: rgba(193,164,108,.45);
            box-shadow: 0 8px 32px rgba(0,0,0,.45), 0 0 0 3px rgba(193,164,108,.1);
        }
        .map-search__icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 15px; pointer-events: none; opacity: .55;
        }
        .map-search input {
            width: 100%; padding: 12px 18px 12px 44px;
            border: none; background: transparent; color: #F9FAFB;
            font-size: 15px; font-family: inherit; outline: none;
            border-radius: 999px;
        }
        .map-search input::placeholder { color: rgba(249,250,251,.4); }
        .map-search__results {
            display: none;
            margin-top: 6px;
            border-radius: 14px;
            background: rgba(12,13,16,.93);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.1);
            list-style: none; padding: 6px 0;
            max-height: 240px; overflow-y: auto;
        }
        .map-search__results.open { display: block; }
        .map-search__results li {
            padding: 10px 16px; cursor: pointer;
            color: rgba(249,250,251,.85); font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .map-search__results li:last-child { border-bottom: none; }
        .map-search__results li:hover { background: rgba(193,164,108,.12); }
        .map-search__results li strong { color: #C1A46C; }

        /* ── Floating Chat ── */
        .map-chat {
            position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: min(520px, 94vw);
            display: flex; flex-direction: column; align-items: center;
        }
        .map-chat__toggle {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(12,13,16,.9);
            backdrop-filter: blur(14px) saturate(1.2);
            color: #F9FAFB; font-size: 13px; font-weight: 700;
            font-family: inherit; cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,.45);
            transition: all .2s ease;
        }
        .map-chat__toggle:hover {
            background: rgba(26,29,34,.95);
            border-color: rgba(193,164,108,.35);
        }
        .map-chat__panel {
            display: none; width: 100%; margin-top: 8px;
            background: rgba(12,13,16,.93);
            backdrop-filter: blur(18px) saturate(1.3);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0,0,0,.55);
            overflow: hidden;
            animation: chatSlideUp .25s ease both;
        }
        .map-chat__panel.open { display: block; }
        @keyframes chatSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .map-chat__thread {
            max-height: 34vh; min-height: 180px;
            overflow-y: auto; padding: 14px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .map-chat__composer {
            padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.08);
            display: flex; gap: 8px; align-items: flex-end;
        }
        .map-chat__composer textarea {
            flex: 1; padding: 10px 14px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05); color: #F9FAFB;
            font-size: 14px; font-family: inherit; outline: none; resize: none;
            min-height: 42px; max-height: 120px; field-sizing: content;
        }
        .map-chat__composer textarea::placeholder { color: rgba(249,250,251,.35); }
        .map-chat__composer textarea:focus { border-color: rgba(193,164,108,.4); }
        .map-chat__composer button {
            padding: 10px 18px; border-radius: 999px;
            border: 1px solid #C1A46C; background: #C1A46C;
            color: #1E2126; font-weight: 800; font-size: 13px;
            font-family: inherit; cursor: pointer;
            transition: transform .12s ease;
        }
        .map-chat__composer button:hover { transform: translateY(-1px); }
        .map-chat__composer button:disabled { opacity: .5; cursor: wait; transform: none; }

        /* ── Chat bubbles ── */
        .bubble {
            width: auto; max-width: 78%; align-self: flex-start;
            border-radius: 14px; padding: 10px 14px; border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.06); color: #F9FAFB;
            font-size: 14px; line-height: 1.45;
            box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 2px 6px rgba(0,0,0,.2);
            word-break: break-word;
        }
        .bubble.user {
            align-self: flex-end; background: #C1A46C; color: #1E2126;
            border-color: #C1A46C; box-shadow: 0 8px 18px rgba(0,0,0,.25);
        }
        .bubble.staff { background: #FBF5E7; border-color: #E6D4A7; color: #1F2937; }
        .bubble.pending { opacity: .65; }
        .bubble.thinking {
            background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(193,164,108,.12) 100%);
            border-color: rgba(193,164,108,.25); color: #E8D5A8; min-width: 160px;
        }
        .thinking-label { font-size: 13px; font-weight: 700; }
        .thinking-dots {
            display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; min-height: 10px;
        }
        .thinking-dots span {
            width: 6px; height: 6px; border-radius: 999px;
            background: currentColor; opacity: .25;
            animation: thinkingDot 1.1s infinite ease-in-out;
        }
        .thinking-dots span:nth-child(2) { animation-delay: .16s; }
        .thinking-dots span:nth-child(3) { animation-delay: .32s; }
        @keyframes thinkingDot {
            0%, 80%, 100% { opacity: .25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .thinking-dots span { animation: none; opacity: .72; transform: none; }
        }
        .bubble__body { white-space: pre-wrap; }

        /* ── Payment card (inside bubble) ── */
        .payment-card {
            display: grid; gap: 10px;
        }
        .payment-card__eyebrow {
            font-size: 12px; font-weight: 800; letter-spacing: .08em;
            text-transform: uppercase; color: #C1A46C;
        }
        .payment-card__title {
            font-size: 16px; font-weight: 800; color: #F9FAFB;
        }
        .payment-card__cta {
            display: inline-flex; align-items: center; justify-content: center;
            width: fit-content; padding: 10px 14px; border-radius: 999px;
            border: 1px solid #C1A46C; background: #C1A46C;
            color: #1E2126; font-weight: 800; text-decoration: none;
            transition: transform .14s ease;
        }
        .payment-card__cta:hover {
            background: #B39150; border-color: #B39150; transform: translateY(-1px);
        }

        /* ── Leaflet overrides ── */
        .leaflet-container { background: #1a1a2e !important; }
        .leaflet-control-attribution {
            background: rgba(12,13,16,.8) !important;
            color: rgba(255,255,255,.45) !important; font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: rgba(193,164,108,.75) !important; }
        .leaflet-control-zoom a {
            background: rgba(12,13,16,.85) !important; color: #F9FAFB !important;
            border-color: rgba(255,255,255,.1) !important;
        }
        .leaflet-control-zoom a:hover { background: rgba(26,29,34,.95) !important; }

        textarea:focus,
        button:focus-visible,
        .agent-hero__audio-toggle:focus-visible,
        .payment-card__cta:focus-visible {
            outline: 2px solid rgba(193,164,108,.55);
            outline-offset: 2px;
        }

        @media (max-width: 640px) {
            .agent-hero { padding: 8px 12px 4px; }
            .agent-hero__camera { border-radius: 12px; }
            .map-search { top: 10px; width: min(420px, 94vw); }
            .map-chat { bottom: 10px; width: min(480px, 96vw); }
            .map-chat__thread { max-height: 30vh; min-height: 140px; }
            .bubble { max-width: 88%; }
        }
    </style>
</head>
<body>
<div class="app">

<!-- ── Camera hero ── -->
<section class="agent-hero">
    <div class="agent-hero__inner">
        <div class="agent-hero__brand">ProstorAI e-Counter</div>
        <div id="liveHelpCamera" class="agent-hero__camera">
            <video id="liveHelpVideo" class="agent-hero__live-video" autoplay playsinline></video>
            <audio id="liveHelpAudio" autoplay muted></audio>
            <div id="liveHelpState" class="agent-hero__camera-state" style="display:none;">
                <div class="agent-hero__camera-eyebrow">Vstopimo v digitalni prostor</div>
                <div id="liveHelpTitle" class="agent-hero__camera-title">Poišči parcelo, preveri tveganja, začni postopek</div>
            </div>
            <div id="liveHelpBadge" class="agent-hero__live-badge" style="display:none;">V živo</div>
            <button id="liveHelpAudioToggle" class="agent-hero__audio-toggle" type="button" style="display:none;">Vklopi zvok</button>
        </div>
    </div>
</section>

<!-- Search bar (lifted above map-stage stacking context) -->
<div class="map-search">
    <div class="map-search__input-wrap">
        <span class="map-search__icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Išči naslov ali parcelo…" autocomplete="off">
    </div>
    <ul class="map-search__results" id="searchResults"></ul>
</div>

<!-- ── Map stage ── -->
<div class="map-stage" id="qualifier-app"
     th:attr="data-org-slug=${organization.slug},data-sid=${sid},data-initial-message=${initialAssistantMessage}">
    <div id="map"></div>

    <!-- Chat overlay -->
    <div class="map-chat">
        <button class="map-chat__toggle" id="chatToggle">
            <span>💬</span>
            <span id="chatToggleLabel">Klepetaj s ProstorAI</span>
        </button>
        <div class="map-chat__panel" id="chatPanel">
            <div id="thread" class="map-chat__thread"></div>
            <div class="map-chat__composer">
                <textarea id="chatInput" rows="1" placeholder="Vprašaj o parceli, tveganjih…"></textarea>
                <button id="chatSendButton" type="button">Pošlji</button>
            </div>
        </div>
    </div>
</div>

</div><!-- /app -->

<script src="https://cdn.jsdelivr.net/npm/proj4@2.9.0/dist/proj4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
/* ── Leaflet map ── */
const map = L.map('map', { zoomControl: false, attributionControl: true })
             .setView([46.1512, 14.9955], 8);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
}).addTo(map);

/* ── Slovenia border (GURS RPE cohesion regions → merged into single outline) ── */
fetch('https://ipi.eprostor.gov.si/wfs-si-gurs-rpe/ogc/features/collections/SI.GURS.RPE:KOHEZIJSKE_REGIJE/items?f=application%2Fgeo%2Bjson&limit=5')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var feats = data.features;
        if (feats && feats.length >= 2) {
            var merged = turf.union(feats[0], feats[1]);
            if (merged) {
                L.geoJSON(merged, {
                    style: { color: '#000', weight: 2, fillOpacity: 0, opacity: 1 },
                    interactive: false
                }).addTo(map);
            }
        }
    })
    .catch(function() {});

/* ── GURS Address Search + Parcel Overlay ── */
function escapeHtml(t){ return String(t||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }

proj4.defs('EPSG:3794', '+proj=tmerc +lat_0=0 +lon_0=15 +k=0.9999 +x_0=500000 +y_0=-5000000 +ellps=GRS80 +units=m +no_defs');

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchMarker = null;
let parcelLayer = null;
let searchDebounce = null;
let spatialContext = null;

function gursToWgs(e, n) {
    var wgs = proj4('EPSG:3794', 'EPSG:4326', [parseFloat(e), parseFloat(n)]);
    return [wgs[1], wgs[0]]; // [lat, lon]
}

async function searchGurs(query) {
    if (!query || query.length < 2) { searchResults.classList.remove('open'); return; }
    try {
        var res = await fetch('https://ipi.eprostor.gov.si/jv-api/search?filter=' + encodeURIComponent(query) + '&source=NSLV-STA-FULL');
        var data = await res.json();
        var items = (data.features || []).slice(0, 6);
        searchResults.innerHTML = '';
        if (!items.length) {
            searchResults.innerHTML = '<li style="color:rgba(249,250,251,.4);cursor:default">Ni rezultatov</li>';
        } else {
            items.forEach(function(f) {
                var p = f.properties;
                var addr = (p.ULICA_NAZIV || '') + ' ' + (p.HS_STEVILKA || '') + ', ' + (p.POSTNI_OKOLIS_SIFRA || '') + ' ' + (p.NASELJE_NAZIV || '');
                var li = document.createElement('li');
                li.innerHTML = '<strong>' + escapeHtml(addr.trim()) + '</strong><br><span style="font-size:11px;opacity:.6">' + escapeHtml(p.OBCINA_NAZIV || '') + ' · EID ' + escapeHtml(p.EID_STAVBA || '') + '</span>';
                li.addEventListener('click', function() { selectGursResult(f); });
                searchResults.appendChild(li);
            });
        }
        searchResults.classList.add('open');
    } catch(e) { console.error('GURS search failed', e); }
}

function selectGursResult(feature) {
    var p = feature.properties;
    var latlng = gursToWgs(p.E, p.N);
    var addr = (p.ULICA_NAZIV || '') + ' ' + (p.HS_STEVILKA || '') + ', ' + (p.NASELJE_NAZIV || '');
    searchResults.classList.remove('open');
    searchInput.value = addr;
    if (parcelLayer) { map.removeLayer(parcelLayer); parcelLayer = null; }
    if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

    // Marker at search coords — this always worked
    searchMarker = L.marker(latlng).addTo(map)
        .bindPopup('<b>' + escapeHtml(addr) + '</b><br>' + escapeHtml(p.OBCINA_NAZIV || '')).openPopup();
    map.flyTo(latlng, 17, { duration: 1 });

    // Fetch parcels around the pin; find the one containing it via turf
    var d = 0.0004; // 40m bbox — tight, fast
    var bbox = (latlng[1] - d) + ',' + (latlng[0] - d) + ',' + (latlng[1] + d) + ',' + (latlng[0] + d);
    var pinPoint = turf.point([latlng[1], latlng[0]]);
    fetch('https://ipi.eprostor.gov.si/wfs-si-gurs-kn/ogc/features/collections/SI.GURS.KN:OSNOVNI_PARCELE/items?f=application%2Fgeo%2Bjson&bbox=' + bbox + '&limit=50')
        .then(function(r) { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(data) {
            var feats = data.features || [];
            // Find the one parcel that contains the pin point
            var match = null;
            for (var i = 0; i < feats.length; i++) {
                try {
                    if (turf.booleanPointInPolygon(pinPoint, feats[i])) {
                        match = feats[i];
                        break;
                    }
                } catch(e) {}
            }
            if (!match) return;
            // Build spatial context for AI chat — fire enrichment fetches
            var fp = match.properties;
            spatialContext = {
                parcel: {
                    stParcele: fp.ST_PARCELE,
                    koId: fp.KO_ID,
                    povrsina: fp.POVRSINA,
                    obcina: p.OBCINA_NAZIV
                }
            };
            // Fetch enriched data in parallel
            var d = 0.0004;
            var bbox2 = (latlng[1] - d) + ',' + (latlng[0] - d) + ',' + (latlng[1] + d) + ',' + (latlng[0] + d);
            Promise.all([
                fetch('https://ipi.eprostor.gov.si/wfs-si-gurs-kn/ogc/features/collections/SI.GURS.KN:STAVBE/items?f=application%2Fgeo%2Bjson&bbox=' + bbox2 + '&limit=5').then(function(r){return r.json()}).catch(function(){return null}),
                fetch('https://ipi.eprostor.gov.si/wfs-si-gurs-kn/ogc/features/collections/SI.GURS.KN:NAMENSKE_RABE/items?f=application%2Fgeo%2Bjson&bbox=' + bbox2 + '&limit=5').then(function(r){return r.json()}).catch(function(){return null}),
                fetch('https://ipi.eprostor.gov.si/wfs-si-gurs-kn/ogc/features/collections/SI.GURS.KN:DEJANSKE_RABE/items?f=application%2Fgeo%2Bjson&bbox=' + bbox2 + '&limit=5').then(function(r){return r.json()}).catch(function(){return null}),
                fetch('https://ipi.eprostor.gov.si/wfs-si-gurs-kn/ogc/features/collections/SI.GURS.KN:BONITETE/items?f=application%2Fgeo%2Bjson&bbox=' + bbox2 + '&limit=5').then(function(r){return r.json()}).catch(function(){return null})
            ]).then(function(results) {
                var stavbe = results[0], namenska = results[1], dejanska = results[2], bonitete = results[3];
                // Find building containing the pin
                if (stavbe && stavbe.features) {
                    for (var i = 0; i < stavbe.features.length; i++) {
                        try { if (turf.booleanPointInPolygon(pinPoint, stavbe.features[i])) {
                            var b = stavbe.features[i].properties;
                            spatialContext.building = {
                                tip: b.TIPI_STAVB_NAZIV_SL,
                                letoIzgradnje: b.LETO_IZGRADNJE,
                                letoObnoveFasade: b.LETO_OBNOVE_FASADE,
                                steviloEtaz: b.STEVILO_ETAZ,
                                steviloStanovanj: b.STEVILO_STANOVANJ,
                                brutoTlorisnaPovrsina: b.BRUTO_TLORISNA_POVRSINA,
                                konstrukcija: b.NOSILNE_KONSTRUKCIJE_NAZIV_SL,
                                elektrika: b.ELEKTRIKA_NAZIV_SL,
                                vodovod: b.VODOVOD_NAZIV_SL,
                                kanalizacija: b.KANALIZACIJA_NAZIV_SL,
                                steviloPoslovnihProstorov: b.STEVILO_POSLOVNIH_PROSTOROV,
                                visinaH1: b.VISINA_H1,
                                visinaH2: b.VISINA_H2
                            };
                            break;
                        }} catch(e) {}
                    }
                }
                // Find zoning containing the pin
                if (namenska && namenska.features) {
                    for (var i = 0; i < namenska.features.length; i++) {
                        try { if (turf.booleanPointInPolygon(pinPoint, namenska.features[i])) {
                            var n = namenska.features[i].properties;
                            spatialContext.landUse = spatialContext.landUse || {};
                            spatialContext.landUse.namenskaRaba = n.PODROBNE_NAMENSKE_RABE_NAZIV_SL + ' — ' + n.PODROBNE_NAMENSKE_RABE_OPIS_SL;
                            break;
                        }} catch(e) {}
                    }
                }
                // Find soil data containing the pin
                if (bonitete && bonitete.features) {
                    for (var i = 0; i < bonitete.features.length; i++) {
                        try { if (turf.booleanPointInPolygon(pinPoint, bonitete.features[i])) {
                            var s = bonitete.features[i].properties;
                            spatialContext.soil = {
                                boniteta: s.BONITETA,
                                tockeTla: s.TOCKE_TLA,
                                tockePodnebje: s.TOCKE_KLIMA,
                                tockeRelief: s.TOCKE_RELIEF
                            };
                            break;
                        }} catch(e) {}
                    }
                }
            }).catch(function(){});

            parcelLayer = L.geoJSON(match, {
                style: { color: '#C1A46C', weight: 3, fillOpacity: 0.12, fillColor: '#C1A46C' },
                onEachFeature: function(f, l) {
                    var fp = f.properties;
                    l.bindPopup('<b>Parcela ' + escapeHtml(fp.ST_PARCELE || '') + '</b><br>KO ' + escapeHtml(fp.KO_ID || '') + '<br>Površina: ' + escapeHtml(fp.POVRSINA || '') + ' m²');
                }
            }).addTo(map);
            try { map.flyToBounds(parcelLayer.getBounds().pad(0.3), { duration: 1 }); } catch(e) {}
        }).catch(function(err) { console.error('Parcel error:', err); });
}

searchInput.addEventListener('input', function() {
    clearTimeout(searchDebounce);
    var q = searchInput.value.trim();
    searchDebounce = setTimeout(function() { searchGurs(q); }, 300);
});

searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { searchResults.classList.remove('open'); }
});

document.addEventListener('click', function(e) {
    if (!e.target.closest('.map-search')) searchResults.classList.remove('open');
});

/* ── Chat toggle ── */
const chatToggle = document.getElementById('chatToggle');
const chatPanel  = document.getElementById('chatPanel');
const chatToggleLabel = document.getElementById('chatToggleLabel');
chatToggle.addEventListener('click', () => {
    const open = chatPanel.classList.toggle('open');
    chatToggleLabel.textContent = open ? 'Zapri klepet' : 'Klepetaj s ProstorAI';
});

/* ── Qualifier chat runtime ── */
(() => {
  const root = document.getElementById('qualifier-app');
  if (!root) return;

  const state = {
    orgSlug: root.dataset.orgSlug,
    sid: root.dataset.sid,
    initialMessage: root.dataset.initialMessage || '',
    sending: false,
    since: 0,
    polling: false,
    messageIds: new Set(),
    pendingMessageIds: new Set(),
    liveHelpState: 'idle',
    liveHelpManagerName: '',
    liveHelpAudioMuted: true,
    localAssistantBubble: null,
    localAssistantStreaming: false,
    localAssistantExpectedText: ''
  };

  const els = {
    thread: document.getElementById('thread'),
    chatInput: document.getElementById('chatInput'),
    chatSendButton: document.getElementById('chatSendButton'),
    liveHelpCamera: document.getElementById('liveHelpCamera'),
    liveHelpState: document.getElementById('liveHelpState'),
    liveHelpTitle: document.getElementById('liveHelpTitle'),
    liveHelpBadge: document.getElementById('liveHelpBadge'),
    liveHelpVideo: document.getElementById('liveHelpVideo'),
    liveHelpAudio: document.getElementById('liveHelpAudio'),
    liveHelpAudioToggle: document.getElementById('liveHelpAudioToggle')
  };

  let liveRoom = null;
  let liveRoomName = null;

  function renderLiveHelp() {
    els.liveHelpCamera.classList.remove('joining', 'live', 'ended');
    if (state.liveHelpState !== 'idle') {
      els.liveHelpCamera.classList.add(state.liveHelpState);
    }
    els.liveHelpVideo.classList.toggle('visible', state.liveHelpState === 'live');
    els.liveHelpState.style.display = (state.liveHelpState === 'joining' || state.liveHelpState === 'ended') ? 'flex' : 'none';
    els.liveHelpBadge.style.display = state.liveHelpState === 'live' ? 'block' : 'none';
    els.liveHelpAudioToggle.style.display = state.liveHelpState === 'live' ? 'inline-flex' : 'none';
    els.liveHelpAudioToggle.textContent = state.liveHelpAudioMuted ? 'Vklopi zvok' : 'Ugasni zvok';

    if (state.liveHelpState === 'joining') {
      els.liveHelpTitle.textContent = (state.liveHelpManagerName || 'Član ekipe') + ' se pridružuje…';
      return;
    }
    if (state.liveHelpState === 'live') {
      els.liveHelpBadge.textContent = (state.liveHelpManagerName || 'Član ekipe') + ' v živo';
      return;
    }
    if (state.liveHelpState === 'ended') {
      els.liveHelpTitle.textContent = 'Povezava je končana';
    }
  }

  function toggleLiveHelpAudio() {
    state.liveHelpAudioMuted = !state.liveHelpAudioMuted;
    els.liveHelpAudio.muted = state.liveHelpAudioMuted;
    els.liveHelpAudioToggle.textContent = state.liveHelpAudioMuted ? 'Vklopi zvok' : 'Ugasni zvok';
    if (!state.liveHelpAudioMuted) {
      els.liveHelpAudio.play().catch(() => {});
    }
  }

  function escapeHtml(text) {
    return String(text || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function linkifyText(text) {
    const safe = escapeHtml(text);
    return safe.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function paymentMessageCard(text) {
    const match = String(text || '').match(/^Prejeli ste zahtevek za plačilo:\s*(.+?)\.\s*Povezava:\s*(https?:\/\/\S+)$/);
    if (!match) return null;
    const purpose = match[1] || 'Plačilo';
    const url = match[2] || '#';
    return `
      <div class="payment-card">
        <div class="payment-card__eyebrow">Zahtevek za plačilo</div>
        <div class="payment-card__title">${escapeHtml(purpose)}</div>
        <a class="payment-card__cta" href="${escapeHtml(url)}" target="_blank" rel="noopener">Odpri plačilo</a>
      </div>
    `;
  }

  function scrollThread() {
    els.thread.scrollTop = els.thread.scrollHeight;
  }

  function resetLocalAssistant() {
    state.localAssistantBubble = null;
    state.localAssistantStreaming = false;
    state.localAssistantExpectedText = '';
  }

  function renderAssistantBubbleText(bubble, text) {
    if (!bubble) return;
    bubble.classList.remove('thinking', 'pending');
    bubble.classList.add('assistant');
    bubble.dataset.role = 'assistant';
    bubble.dataset.pending = 'false';
    bubble.dataset.text = text || '';
    bubble.innerHTML = `<div class="bubble__body"></div>`;
    bubble.querySelector('.bubble__body').innerHTML = paymentMessageCard(text) || linkifyText(text || '');
    scrollThread();
  }

  function appendThinkingBubble() {
    if (state.localAssistantBubble?.isConnected) return state.localAssistantBubble;
    const bubble = document.createElement('div');
    bubble.className = 'bubble assistant thinking pending';
    bubble.dataset.role = 'assistant';
    bubble.dataset.pending = 'true';
    bubble.innerHTML = `
      <div class="thinking-label">ProstorAI razmišlja</div>
      <div class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    `;
    els.thread.appendChild(bubble);
    state.localAssistantBubble = bubble;
    state.localAssistantStreaming = true;
    state.localAssistantExpectedText = '';
    scrollThread();
    return bubble;
  }

  function appendAssistantChunk(chunk) {
    const bubble = appendThinkingBubble();
    state.localAssistantExpectedText += chunk || '';
    renderAssistantBubbleText(bubble, state.localAssistantExpectedText);
  }

  function removeLocalAssistantBubble() {
    state.localAssistantBubble?.remove();
    resetLocalAssistant();
  }

  function appendMessage(role, text, timestamp, options = {}) {
    const id = role + '|' + text + '|' + timestamp;
    const pending = !!options.pending;
    if (!pending && role === 'user') {
      const pendingBubble = Array.from(els.thread.querySelectorAll('.bubble.pending[data-role="user"]')).find(node => (node.dataset.text || '') === String(text || ''));
      if (pendingBubble) {
        pendingBubble.classList.remove('pending');
        pendingBubble.dataset.pending = 'false';
        pendingBubble.dataset.messageId = id;
        state.pendingMessageIds.delete(pendingBubble.dataset.tempId || '');
        state.messageIds.add(id);
        return;
      }
    }
    if (!pending && role === 'assistant' && state.localAssistantBubble?.isConnected) {
      const localText = state.localAssistantExpectedText || state.localAssistantBubble.dataset.text || '';
      const incomingText = String(text || '');
      if (!incomingText || !localText || incomingText === localText || incomingText.startsWith(localText) || localText.startsWith(incomingText)) {
        if (incomingText) {
          state.localAssistantExpectedText = incomingText;
          renderAssistantBubbleText(state.localAssistantBubble, incomingText);
        }
        if (!state.localAssistantStreaming) {
          state.localAssistantBubble.dataset.messageId = id;
          state.messageIds.add(id);
        }
        return;
      }
    }
    if (!pending && state.messageIds.has(id)) return;
    if (!pending) state.messageIds.add(id);
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role + (pending ? ' pending' : '');
    bubble.dataset.role = role;
    bubble.dataset.text = text || '';
    bubble.dataset.pending = pending ? 'true' : 'false';
    if (options.tempId) bubble.dataset.tempId = options.tempId;
    if (!pending) bubble.dataset.messageId = id;
    bubble.innerHTML = `<div class="bubble__body"></div>`;
    bubble.querySelector('.bubble__body').innerHTML = paymentMessageCard(text) || linkifyText(text || '');
    els.thread.appendChild(bubble);
    scrollThread();
  }

  function appendPendingUserMessage(text) {
    const tempId = 'pending-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    state.pendingMessageIds.add(tempId);
    appendMessage('user', text, tempId, { pending: true, tempId });
    return tempId;
  }

  function removePendingMessage(tempId) {
    if (!tempId) return;
    state.pendingMessageIds.delete(tempId);
    els.thread.querySelector(`[data-temp-id="${tempId}"]`)?.remove();
  }

  async function loadThread() {
    const res = await fetch(`/api/public/organizations/${encodeURIComponent(state.orgSlug)}/leads/${encodeURIComponent(state.sid)}/messages`, { credentials: 'same-origin' });
    if (!res.ok) return;
    const items = await res.json();
    els.thread.innerHTML = '';
    state.messageIds.clear();
    state.pendingMessageIds.clear();
    resetLocalAssistant();
    items.forEach(item => appendMessage(item.role, item.text, item.timestamp));
    if (!items.length && state.initialMessage) {
      appendMessage('assistant', state.initialMessage, 'init');
    }
  }

  function disconnectLiveHelpRoom() {
    try { liveRoom?.disconnect(); } catch {}
    liveRoom = null;
    liveRoomName = null;
    els.liveHelpVideo.srcObject = null;
    els.liveHelpAudio.srcObject = null;
    try { els.liveHelpVideo.load(); } catch {}
    try { els.liveHelpAudio.load(); } catch {}
  }

  async function connectToLiveHelp(live) {
    const client = window.LivekitClient;
    if (!client || !live?.ws_url || !live?.token || !live?.room_name) return;
    if (liveRoom && liveRoomName === live.room_name) {
      state.liveHelpState = 'live';
      renderLiveHelp();
      return;
    }

    disconnectLiveHelpRoom();
    state.liveHelpState = 'joining';
    renderLiveHelp();

    try {
      const room = new client.Room();
      room.on(client.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === client.Track.Kind.Video) {
          track.attach(els.liveHelpVideo);
          els.liveHelpVideo.autoplay = true;
          els.liveHelpVideo.playsInline = true;
          els.liveHelpVideo.play().catch(() => {});
          state.liveHelpState = 'live';
          renderLiveHelp();
        }
        if (track.kind === client.Track.Kind.Audio) {
          els.liveHelpAudio.autoplay = true;
          els.liveHelpAudio.muted = state.liveHelpAudioMuted;
          track.attach(els.liveHelpAudio);
        }
      });
      room.on(client.RoomEvent.Disconnected, () => {
        disconnectLiveHelpRoom();
        state.liveHelpState = 'ended';
        renderLiveHelp();
      });
      await room.connect(live.ws_url, live.token);
      liveRoom = room;
      liveRoomName = live.room_name;
    } catch (error) {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'ended';
      renderLiveHelp();
    }
  }

  async function loadLiveHelpState() {
    const res = await fetch(`/api/public/organizations/${encodeURIComponent(state.orgSlug)}/live-session?sid=${encodeURIComponent(state.sid)}`, { credentials: 'same-origin' });
    if (!res.ok) return;
    const live = await res.json();
    state.liveHelpManagerName = live.manager_display_name || live.managerDisplayName || '';
    if (live.status === 'live') {
      await connectToLiveHelp(live);
      state.liveHelpState = 'live';
    } else if (live.status === 'preview') {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'joining';
    } else if (live.status === 'ended') {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'ended';
    } else {
      disconnectLiveHelpRoom();
      state.liveHelpState = 'idle';
    }
    renderLiveHelp();
  }

  async function sendMessage() {
    const text = (els.chatInput.value || '').trim();
    if (!text || state.sending) return;
    state.sending = true;
    els.chatSendButton.disabled = true;
    els.chatInput.value = '';
    const pendingId = appendPendingUserMessage(text);
    appendThinkingBubble();
    try {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/plain' },
        body: JSON.stringify({ sid: state.sid, message: text, tenant_slug: state.orgSlug, meta: { organization_slug: state.orgSlug, spatialContext: spatialContext } })
      });
      if (!res.ok) {
        const body = await res.text().catch(() => '');
        console.error('Qualifier chat stream bad response', res.status, body.slice(0, 240));
        removePendingMessage(pendingId);
        removeLocalAssistantBubble();
        appendMessage('assistant', '⚠️ Odgovor ni uspel. Poskusi znova.', 'error-' + Date.now());
        return;
      }

      const streamedSid = res.headers.get('X-ACE-Sid');
      if (streamedSid && streamedSid !== state.sid) {
        state.sid = streamedSid;
        history.replaceState({}, '', `/${state.orgSlug}?sid=${encodeURIComponent(streamedSid)}`);
      }

      const reader = res.body?.getReader();
      const decoder = new TextDecoder();
      let streamedText = '';

      if (!reader) {
        streamedText = await res.text().catch(() => '');
        if (streamedText) appendAssistantChunk(streamedText);
      } else {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          if (!chunk) continue;
          streamedText += chunk;
          appendAssistantChunk(chunk);
        }
        const tail = decoder.decode();
        if (tail) {
          streamedText += tail;
          appendAssistantChunk(tail);
        }
      }

      state.localAssistantStreaming = false;
      state.localAssistantExpectedText = streamedText;
      if (!streamedText.trim()) {
        removeLocalAssistantBubble();
      }

      await Promise.all([loadThread(), loadLiveHelpState()]);
    } catch (error) {
      console.error('Qualifier chat stream failed', error);
      removePendingMessage(pendingId);
      removeLocalAssistantBubble();
      appendMessage('assistant', '⚠️ Odgovor ni uspel. Poskusi znova.', 'error-' + Date.now());
    } finally {
      state.sending = false;
      els.chatSendButton.disabled = false;
    }
  }

  async function poll() {
    if (state.polling) return;
    state.polling = true;
    try {
      const res = await fetch(`/chat-events/poll?sid=${encodeURIComponent(state.sid)}&tenantSlug=${encodeURIComponent(state.orgSlug)}&since=${state.since}&timeout=20`, { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      (data.events || []).forEach(evt => {
        state.since = Math.max(state.since, evt._seq || 0);
        if (evt.type === 'message.created') {
          const role = evt.payload?.role || 'assistant';
          if (role === 'assistant' && state.localAssistantStreaming) {
            return;
          }
          appendMessage(role, evt.payload?.text || '', evt.payload?.timestamp || evt.ts);
        }
        if (evt.type === 'live_session.live') {
          state.liveHelpManagerName = evt.payload?.managerDisplayName || evt.payload?.manager_display_name || state.liveHelpManagerName;
          loadLiveHelpState();
        }
        if (evt.type === 'live_session.ended') {
          disconnectLiveHelpRoom();
          state.liveHelpState = 'ended';
          renderLiveHelp();
          setTimeout(() => {
            if (state.liveHelpState === 'ended') {
              state.liveHelpState = 'idle';
              renderLiveHelp();
            }
          }, 3200);
        }
      });
      state.since = Math.max(state.since, data.next || state.since);
    } finally {
      state.polling = false;
      setTimeout(poll, 250);
    }
  }

  els.liveHelpAudioToggle.addEventListener('click', toggleLiveHelpAudio);
  els.chatSendButton.addEventListener('click', sendMessage);
  els.chatInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  renderLiveHelp();
  loadLiveHelpState().finally(() => loadThread().finally(poll));
})();
</script>
